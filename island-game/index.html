<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <title>Island Catcher - Dynamic Island Game</title>
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <!-- Dynamic Island Simulation -->
    <div class="dynamic-island" id="dynamicIsland">
        <div class="island-content">
            <span id="islandText">🎮</span>
        </div>
    </div>

    <!-- Game Container -->
    <div class="game-container" id="gameContainer">
        <!-- Score Display -->
        <div class="score-panel">
            <div class="score-item">
                <span class="score-label">Score:</span>
                <span class="score-value" id="score">0</span>
            </div>
            <div class="score-item">
                <span class="score-label">Lives:</span>
                <span class="score-value" id="lives">❤️❤️❤️</span>
            </div>
        </div>

        <!-- Game Area -->
        <div class="game-area" id="gameArea">
            <!-- Falling items will be spawned here -->
        </div>

        <!-- Player Basket -->
        <div class="basket" id="basket">
            🧺
        </div>

        <!-- Start Screen -->
        <div class="start-screen" id="startScreen">
            <h1>🏝️ Island Catcher</h1>
            <p>Catch the good items falling from the Dynamic Island!</p>
            <div class="instructions">
                <p>🍎 🍊 🍋 = Good (+10 points)</p>
                <p>💣 ☠️ 🔥 = Bad (-1 life)</p>
                <p>⭐ = Star (+50 points)</p>
            </div>
            <button class="start-button" id="startButton">Start Game</button>
            <p class="tip">Tip: Move by touching/dragging on the screen</p>
        </div>

        <!-- Game Over Screen -->
        <div class="game-over-screen hidden" id="gameOverScreen">
            <h1>Game Over!</h1>
            <p class="final-score">Final Score: <span id="finalScore">0</span></p>
            <button class="restart-button" id="restartButton">Play Again</button>
        </div>
    </div>

    <script src="game.js"></script>
</body>
</html>
